[project]
name = "hfb-test-data"
version = "0.1.0"
description = "Synthetic test-dataset generator for the HFB Proactive AI Chatbot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Runtime deps for the HFB services (A1 platform skeleton onward, POA/15).
services = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",     # FastAPI TestClient
    "ruff>=0.5",
    # optional enhancements referenced in POA/16 §8 (not required to run the scaffold):
    # "faker", "numpy", "hypothesis", "respx", "testcontainers", "polyfactory",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
